# Egress filter for the TNN remote browser.
# The browser container has no network route except through this proxy, and
# this proxy refuses anything that is not on the public internet: the Mac
# itself, the home network, link-local and cloud-metadata addresses.
# Squid checks the address a name resolves to, so a public-looking name that
# points at 127.0.0.1 or 192.168.x.x is refused too.

http_port 3128

cache deny all
access_log none
cache_log /tmp/squid-cache.log
pid_filename /tmp/squid.pid
coredump_dir /tmp
forwarded_for delete

acl private_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
# Not ::ffff:0:0/96: Squid treats every IPv4 address as IPv4-mapped, so that
# range would match all of them. The IPv4 rules above already cover mapped ones.
acl private_v6 dst ::1 fc00::/7 fe80::/10
acl local_names dstdomain .localhost .local .localdomain .lan .home.arpa .internal
acl mail_ports port 25 465 587

http_access deny local_names
http_access deny private_v4
http_access deny private_v6
http_access deny mail_ports
http_access allow all
